{% extends "base.html" %}

{% block content %}
<section class="page-header">
  <h1>Tag: {{ term.name }}</h1>
</section>

<section class="post-list">
  {% for post in term.pages | sort(attribute="date") | reverse %}
    <article class="post-list-item">
      <a class="post-title" href="{{ post.permalink }}">
        {{ post.title }}
      </a>

      {% if post.date %}
        <time class="post-date" datetime="{{ post.date }}">
          {{ post.date | date(format="%d %b %Y") }}
        </time>
      {% endif %}
    </article>
  {% endfor %}
</section>
{% endblock content %}
