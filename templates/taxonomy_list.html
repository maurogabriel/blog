{% extends "base.html" %}

{% block content %}
<section class="page-header">
  <h1>Tags</h1>
</section>

<section class="tag-list">
  {% for term in terms %}
    <a href="{{ term.permalink }}">
      {{ term.name }} ({{ term.pages | length }})
    </a>
  {% endfor %}
</section>
{% endblock content %}
