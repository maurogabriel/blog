{% extends "base.html" %}

{% block content %}
<section class="page-header">
  <h1>Tags</h1>
</section>

<section class="tag-list">
  <ul>
    {% for term in terms %}
      <li>
        <a href="{{ term.permalink }}">
          <span class="tag-name">{{ term.name }}</span>
          <span class="tag-count">{{ term.pages | length }}</span>
        </a>
      </li>
    {% endfor %}
  </ul>
</section>
{% endblock content %}
