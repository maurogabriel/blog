{% extends "base.html" %}

{% block description %}{{ page.description | default(value=page.summary | default(value="") | striptags) | default(value=config.description) }}{% endblock description %}

{% block content %}

<article class="page">
  <header class="page-header">
    <h1>{{ page.title }}</h1>
  </header>

  <div class="page-content">
    {{ page.content | safe }}
  </div>
</article>

{% endblock content %}
